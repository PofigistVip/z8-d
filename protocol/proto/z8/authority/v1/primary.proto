syntax = "proto3";

package z8.authority.v1;

import "z8/authority/v1/common.proto";
import "z8/authority/v1/file.proto";

message Decimal {
  string coefficient = 1;
  sint32 scale = 2;
  bool nan = 3;
}

message Geometry {
  string ewkb_hex = 1;
  sint32 srid = 2;
}

message Binary {
  bytes data = 1;
  optional string name = 2;
}

message CustomPrimary {
  string class_id = 1;
  bytes payload = 2;
}

// Null and default scalar values remain distinct through oneof presence.
message Primary {
  oneof value {
    bool null_value = 1;
    sint64 integer_value = 2;
    bool boolean_value = 3;
    Decimal decimal_value = 4;
    string text_value = 5;
    Guid guid_value = 6;
    sint64 date_ticks = 7;
    sint64 datespan_milliseconds = 8;
    Geometry geometry_value = 9;
    Binary binary_value = 10;
    FileMetadata file_value = 11;
    CustomPrimary custom_value = 12;
  }
}
